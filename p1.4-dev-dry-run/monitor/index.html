<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L3 · DEV 双臂运行进度</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f7fa,#14171c);--panel:light-dark(#fff,#1c2027);--fg:light-dark(#192333,#edf0f6);--muted:light-dark(#606d7e,#a8b1bf);--line:light-dark(#e2e7ee,#333a46);--track:light-dark(#eaf0f4,#2c333e);--blue:light-dark(#2864d6,#80b0ff);--green:light-dark(#167f68,#6ed5b4);--red:light-dark(#bb3e49,#ff929c);--amber:light-dark(#9b6b0e,#e8c57c);--soft-blue:light-dark(#e7efff,#263b5b);--soft-green:light-dark(#e3f3ed,#213c35);--soft-red:light-dark(#fbe9eb,#4b2d33);--soft-amber:light-dark(#fbf0da,#423824)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft Yahei",sans-serif}main{max-width:1120px;margin:30px auto;padding:0 24px 36px}h1,h2,p{margin:0}h1{font-size:28px;font-weight:600;letter-spacing:-.03em}h2{font-size:16px;font-weight:600}.muted{color:var(--muted)}.small{font-size:12px}.mono{font-variant-numeric:tabular-nums}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.top{margin-bottom:24px}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.1em;margin-bottom:5px}.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:30px;background:var(--soft-blue);color:var(--blue);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,a.action{color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;font-size:12px;text-decoration:none;cursor:pointer}button:hover,a.action:hover{background:var(--track)}a[aria-disabled=true]{pointer-events:none;opacity:.4}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}.value{font-size:30px;letter-spacing:-.04em;margin:9px 0 3px;font-weight:600}.value span{font-size:15px;font-weight:400;letter-spacing:0;color:var(--muted)}.track{height:7px;background:var(--track);border-radius:10px;display:flex;overflow:hidden;margin:13px 0 8px}.track>div{height:100%;transition:width .3s}.fill{background:var(--blue)}.paid{background:var(--green)}.reserved{background:var(--amber)}.success-mark{background:var(--green)}.failed-mark{background:var(--red)}.admin-mark{background:var(--amber)}.current{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;margin-bottom:20px}.stage{font-size:19px;font-weight:600;margin:4px 0}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.chip{padding:3px 9px;color:var(--muted);background:var(--track);border-radius:5px;font-size:12px}.chip.active{background:var(--soft-blue);color:var(--blue)}.arms{display:grid;grid-template-columns:1fr 1fr;gap:16px}.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:18px 0 15px}.tile{padding:11px 2px;border:0;border-radius:7px;text-align:center;background:var(--track);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.tile.success{background:var(--soft-green);color:var(--green)}.tile.active{background:var(--soft-blue);color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}.tile.failed{background:var(--soft-red);color:var(--red)}.tile.administrative{background:var(--soft-amber);color:var(--amber)}.tile[aria-pressed=true]{outline:2px solid var(--fg);outline-offset:2px}.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:15px 0;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}.detail{padding:13px 0;min-height:48px}.recent{margin-top:18px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px;margin-top:13px}th,td{text-align:left;padding:11px 6px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:400}th:last-child,td:last-child{text-align:right}.banner{display:none;background:var(--soft-amber);color:var(--fg);padding:13px 17px;border-radius:10px;margin-bottom:16px}.footer{margin-top:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.error{color:var(--red)}.progress-label{font-size:12px}.divider{border:0;border-top:1px solid var(--line);margin:17px 0}.case-context{font-size:12px;margin-top:3px;overflow-wrap:anywhere}#error{margin:12px 0}#stop-reasons{overflow-wrap:anywhere}@media(max-width:760px){main{padding:0 16px;margin-top:20px}.arms{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats .panel:last-child{grid-column:1/-1}h1{font-size:24px}.current{grid-template-columns:1fr}.panel{padding:16px}}@media(max-width:420px){.stats{grid-template-columns:1fr}.stats .panel:last-child{grid-column:auto}.tiles{gap:5px}.value{font-size:27px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main id="progress-page">
<header class="top"><div><div class="eyebrow">LAYER 3 / PHASE 1</div><h1>DEV 双臂运行进度</h1><p class="muted small" id="run-label">正在连接运行账本…</p></div><div class="controls"><span id="status" class="badge"><i class="dot"></i><span>读取中</span></span><button id="refresh" type="button">立即刷新</button></div></header>
<div id="error" class="error" role="alert"></div><div id="banner" class="banner" role="status"></div>
<section class="stats" aria-label="总体进度与预算">
<div class="panel"><p class="muted">已记录终态</p><p id="terminal" class="value mono">— <span>/ — 运行臂</span></p><div class="track" role="progressbar" aria-label="已记录终态" id="total-bar" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0"><div class="fill" id="total-fill" style="width:0"></div></div><p class="small muted">包含成功、失败和行政中止</p></div>
<div class="panel"><p class="muted">完整配对</p><p id="pairs" class="value mono">— <span>/ — 病例</span></p><p class="small muted" id="pair-info">A0、A1 均成功才计入</p></div>
<div class="panel"><p class="muted">联合参考消耗</p><p id="cost" class="value mono">¥— <span>/ ¥30 上限</span></p><div class="track" role="meter" id="budget-bar" aria-label="联合参考预算占用" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0"><div id="spent-fill" class="paid"></div><div id="reserve-fill" class="reserved"></div></div><p class="small muted mono" id="reserve">在途预留 —；usage 缺失 — 次</p></div>
</section>
<section class="panel current" aria-label="当前执行"><div><p class="muted small" id="current-label">当前执行</p><p class="stage" id="current-stage">读取中</p><p id="current-case" class="muted case-context">—</p><div class="chips" id="stages"></div></div><div><div id="elapsed" class="mono">总耗时 —</div><div id="request-time" class="small muted mono">当前请求 —</div></div></section>
<section class="arms" id="arms" aria-label="逐病例进度"></section>
<div class="legend"><span><i style="background:var(--green)"></i>成功</span><span><i style="background:var(--blue)"></i>进行中</span><span><i style="background:var(--red)"></i>失败</span><span><i style="background:var(--amber)"></i>行政中止</span><span><i style="background:var(--track)"></i>等待</span></div>
<div id="detail" class="detail muted small" aria-live="polite">点击病例编号查看该运行臂的状态。</div>
<section class="panel recent"><div class="row"><h2>最近请求</h2><span class="small muted" id="request-count">—</span></div><div class="tablewrap"><table><thead><tr><th>时间</th><th>运行臂 / 病例</th><th>阶段</th><th>状态</th><th>耗时</th></tr></thead><tbody id="requests"></tbody></table></div></section>
<section class="panel recent" id="results" hidden><div class="row"><h2 id="results-title">运行已收尾</h2><div class="controls"><a class="action" href="/results.json" target="_blank" rel="noopener">查看结束摘要</a><a class="action" href="/ledger" target="_blank" rel="noopener">查看工程账本</a></div></div><p id="final-info" style="margin-top:10px"></p><p id="stop-reasons" class="small muted"></p></section>
<footer class="footer"><span>每 5 秒刷新 · <span id="checked">—</span></span><span>峰时全未命中参考 · 实付未核 · 本页不调用诊断模型</span></footer>
</main><script>
const root=document.getElementById('progress-page');
const el=id=>root.querySelector('#'+id);
const stageNames={a0:'无知识候选生成',screening:'入口筛查',anchor:'症状锚定',guard:'排除判断',criteria:'诊断标准',verifier:'独立核验',administrative:'行政收尾',replay:'只读回放'};
const labels={success:'成功',active:'进行中',failed:'失败',administrative:'行政中止',waiting:'等待'};
const states={running:'运行中',unconfirmed:'日志更新中 · 进程状态待核查',closing:'停止新调用 · 收尾中',finished:'运行已收尾',stopped:'提前停批 · 已收尾',abnormal:'进程已退出 · 未生成结束摘要'};
const stopLabels={budget_forecast:'剩余预算低于预测门槛',arm_stop:'运行臂触发停批',joint_completion_impossible:'联合完成率已不可能达标',persisted_arm_stop:'沿用原停批状态',orchestration_error:'协调异常'};
let selected=null,lastData=null,busy=false;
function duration(v){if(v==null)return '—';v=Math.floor(v);return v>=3600?`${Math.floor(v/3600)}时${Math.floor(v%3600/60)}分`:v>=60?`${Math.floor(v/60)}分${v%60}秒`:`${v}秒`;}
function time(v){return v?new Date(v).toLocaleTimeString('zh-CN',{hour12:false,timeZone:'Asia/Shanghai'}):'—';}
function text(tag,value,cls){const node=document.createElement(tag);node.textContent=value;if(cls)node.className=cls;return node;}
function render(data){lastData=data;el('run-label').textContent=data.run_id+' · '+(data.model||'模型未登记');el('status').lastElementChild.textContent=states[data.status]||data.status;el('terminal').replaceChildren(text('b',data.terminal_arms),text('span',' / '+data.planned_arms+' 运行臂'));el('pairs').replaceChildren(text('b',data.joint_complete),text('span',' / '+data.planned_cases+' 病例'));el('total-fill').style.width=(data.planned_arms?100*data.terminal_arms/data.planned_arms:0)+'%';el('total-bar').setAttribute('aria-valuenow',data.terminal_arms);el('total-bar').setAttribute('aria-valuemax',data.planned_arms);
const budget=data.reference_budget;el('cost').replaceChildren(text('b','¥'+budget.consumed_upper_yuan.toFixed(3)),text('span',' / ¥'+budget.limit_yuan+' 上限'));el('spent-fill').style.width=Math.min(100,100*budget.consumed_upper_yuan/budget.limit_yuan)+'%';el('reserve-fill').style.width=Math.max(0,Math.min(100-100*budget.consumed_upper_yuan/budget.limit_yuan,100*budget.pending_reservation_yuan/budget.limit_yuan))+'%';el('budget-bar').setAttribute('aria-valuenow',budget.consumed_upper_yuan+budget.pending_reservation_yuan);el('reserve').textContent='在途预留 ¥'+budget.pending_reservation_yuan.toFixed(3)+' · usage 缺失 '+budget.finished_usage_missing+' 次';
const current=data.current;el('current-label').textContent=data.final_ready?'最近执行':'当前执行';el('current-stage').textContent=current?(stageNames[current.stage]||current.stage)+(current.pending?' · 等待模型返回':' · 本次请求已返回'):'等待请求';el('current-case').textContent=current?current.arm+' / '+current.case_id+' · HTTP 第 '+current.attempt+' 次尝试':'尚无请求';el('elapsed').textContent='总耗时 '+duration(data.elapsed_seconds);el('request-time').textContent='该请求 '+duration(current?.elapsed_seconds);el('stages').replaceChildren(...['screening','anchor','guard','criteria','verifier'].map(s=>text('span',stageNames[s], 'chip'+(current?.stage===s?' active':''))));
el('arms').replaceChildren();for(const arm of ['A0','A1']){const a=data.arms[arm];const section=text('article','','panel');const heading=text('div','','row');heading.append(text('h2',arm+' · '+(arm==='A0'?'无知识基线':'G1 诊断引擎')),text('span',a.terminal+' / '+a.planned+' 已记录','muted small mono'));section.append(heading);const track=text('div','','track');for(const [name,cls] of [['success','success-mark'],['failed','failed-mark'],['administrative','admin-mark']]){const mark=text('div','',cls);mark.style.width=(a.planned?100*a[name]/a.planned:0)+'%';track.append(mark);}section.append(track);const tiles=text('div','','tiles');for(const cell of data.cells.filter(c=>c.arm===arm)){const button=text('button',cell.case_id.replace(/^mb-/,''),'tile '+cell.status);button.type='button';button.setAttribute('aria-label',`${cell.arm} ${cell.case_id} ${labels[cell.status]}`);button.setAttribute('aria-pressed',String(selected===arm+':'+cell.case_id));button.addEventListener('click',()=>{selected=arm+':'+cell.case_id;render(lastData);});tiles.append(button);}section.append(tiles,text('p',`成功 ${a.success} · 失败 ${a.failed} · 行政中止 ${a.administrative} · 等待 ${a.waiting}`,'muted small'));el('arms').append(section);}
if(selected){const cell=data.cells.find(c=>selected===c.arm+':'+c.case_id);el('detail').textContent=cell?`${cell.arm} / ${cell.case_id} · ${labels[cell.status]} · ${cell.stage?stageNames[cell.stage]||cell.stage:'未启动'} · HTTP尝试 ${cell.http_attempts}${cell.failure_class?' · '+cell.failure_class:''}`:'请选择病例';}
el('requests').replaceChildren();for(const request of data.requests){const tr=document.createElement('tr');const status=request.pending?'请求进行中':request.error_type?(request.error_category||request.error_type):'HTTP '+request.status_code;for(const value of [time(request.started_at),request.arm+' / '+request.case_id,stageNames[request.stage]||request.stage,status,duration(request.elapsed_seconds)])tr.append(text('td',value));el('requests').append(tr);}el('request-count').textContent='共 '+data.http_attempts+' 次 HTTP 尝试';
const warning=data.status==='abnormal'?'运行进程已退出，但没有结束摘要。请让助手核查异常；已发生请求仍保留。':data.status==='closing'?'已触发停止条件，正在为两臂未启动病例写入行政终态。':data.status==='stopped'?'本批已提前停批，请查看完成数和停批原因。':'';el('banner').textContent=warning;el('banner').style.display=warning?'block':'none';el('results').hidden=!data.final_ready;if(data.final_ready){el('results-title').textContent=data.status==='stopped'?'提前停批，结果已保存':'运行收尾，结果已保存';el('final-info').textContent=`A0 成功 ${data.arms.A0.success}/${data.planned_cases}，A1 成功 ${data.arms.A1.success}/${data.planned_cases}；完整配对 ${data.joint_complete}/${data.planned_cases}。运行结束不等于工程验收通过。`;el('stop-reasons').textContent=data.stop_reasons.length?'停批原因：'+data.stop_reasons.map(s=>stopLabels[s]||s).join('；'):'未触发停批条件。';if(data.failures.budget){el('stop-reasons').textContent+=' 单例预算中止 '+data.failures.budget+' 例：剩余额度不足以预留后续请求，并非模型契约失败。';}}el('checked').textContent='最后检查 '+time(data.checked_at);document.title=(data.final_ready?'已结束':'运行中')+' · L3 DEV-'+data.planned_cases;}
async function refresh(){if(busy)return;busy=true;el('refresh').disabled=true;try{const response=await fetch('/status.json',{cache:'no-store'});if(!response.ok)throw new Error('状态暂不可读');render(await response.json());el('error').textContent='';}catch(error){el('error').textContent='连接暂不可用，保留上次结果；将自动重试。';}finally{busy=false;el('refresh').disabled=false;}}
el('refresh').addEventListener('click',refresh);refresh();setInterval(refresh,5000);
</script></body></html>
