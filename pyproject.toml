[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psychotherapy-llm"
version = "0.2.0"
description = "五层认知架构心理诊疗LLM（L1安全评估/L3诊断推理/L4治疗对话/L5输出审核 + 统一接口契约）"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["layers*", "shared*", "icd10_tree*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
